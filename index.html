<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAC-MAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <div id="hud">
      <div class="hud-block">
        <span class="hud-label">1UP</span>
        <span id="score" class="hud-value">00</span>
      </div>
      <div class="hud-block">
        <span class="hud-label">HIGH SCORE</span>
        <span id="high-score" class="hud-value">00</span>
      </div>
      <div class="hud-block">
        <span class="hud-label">LEVEL</span>
        <span id="level" class="hud-value">1</span>
      </div>
      <button id="exit-btn" class="exit-btn hidden" type="button">✕ SALIR</button>
    </div>

    <div id="canvas-wrapper">
      <canvas id="game-canvas"></canvas>

      <div id="overlay" class="overlay">
        <div id="overlay-title" class="overlay-title">PAC-MAN</div>
        <div id="overlay-message" class="overlay-message">Presiona ENTER o toca la pantalla para jugar</div>

        <div id="name-entry" class="name-entry hidden">
          <p class="name-entry-label">¡Guarda tu puntaje!</p>
          <input id="name-input" class="name-input" maxlength="10" autocomplete="off" placeholder="TU NOMBRE">
          <button id="submit-score-btn" class="arcade-btn" type="button">GUARDAR</button>
        </div>

        <div id="leaderboard-panel" class="leaderboard-panel hidden">
          <div class="leaderboard-title">🏆 RANKING</div>
          <div class="leaderboard-header">
            <span>#</span><span>NOMBRE</span><span>PUNTOS</span>
          </div>
          <ol id="leaderboard-list" class="leaderboard-list"></ol>
          <p id="leaderboard-note" class="leaderboard-note hidden"></p>
          <button id="close-leaderboard-btn" class="arcade-btn" type="button">CERRAR</button>
        </div>

        <div id="overlay-controls" class="overlay-controls">
          Usa las flechas o WASD para moverte<br>
          M para silenciar el sonido
        </div>

        <button id="ranking-btn" class="arcade-btn ranking-btn" type="button">🏆 VER RANKING</button>

        <div id="restart-hint" class="restart-hint hidden">Presiona ENTER para jugar de nuevo</div>
      </div>
    </div>

    <div id="lives-row">
      <span class="hud-label">VIDAS</span>
      <div id="lives-icons"></div>
    </div>

    <div id="touch-controls">
      <div class="tc-row">
        <button class="tc-btn" data-dir="up">&#9650;</button>
      </div>
      <div class="tc-row">
        <button class="tc-btn" data-dir="left">&#9664;</button>
        <button class="tc-btn" data-dir="down">&#9660;</button>
        <button class="tc-btn" data-dir="right">&#9654;</button>
      </div>
    </div>
  </div>

  <script src="maze.js"></script>
  <script src="audio.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="leaderboard.js"></script>
  <script src="game.js"></script>
</body>
</html>
